      <path d="M-86 0 0 43v11l-86-43Z" fill="url(#deck-edge)"/>
      <path d="M0 43 86 0v11L0 54Z" fill="#713042"/>
      <path d="M-86 0 0-43 86 0 0 43Z" fill="url(#deck-top)" stroke="#ee857d" stroke-width="1"/>
