  <path d="M40 231 174 347 400 425 626 347 760 231v19L626 372 400 455 174 372 40 250Z" fill="url(#side)" stroke="#8a394c" stroke-width="1.2"/>
  <path d="M40 242 174 361 400 441 626 361 760 242" stroke="#bc5261" stroke-opacity=".66"/>
  <path d="m174 358 226 83 226-83" stroke="#ff927a" stroke-opacity=".27" stroke-width="2"/>
  <path d="m207 362 43 15m10 4 11 4m10 4 11 4m216 9 11-4m9-4 11-4m11-4 41-15" stroke="#ff957a" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
