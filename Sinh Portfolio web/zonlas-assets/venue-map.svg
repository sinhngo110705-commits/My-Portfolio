<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <title>Sơ đồ sáu phân khu trong hạ tầng sự kiện Zonlas</title>
  <defs>
    <radialGradient id="night" cx=".55" cy=".46" r=".68">
      <stop stop-color="#53202d"/>
      <stop offset=".62" stop-color="#2b121d"/>
      <stop offset="1" stop-color="#160e16"/>
    </radialGradient>
    <radialGradient id="spill">
      <stop stop-color="#ff515f" stop-opacity=".27"/>
      <stop offset="1" stop-color="#e3294c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="400" y1="48" x2="400" y2="431" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b2635"/>
      <stop offset=".48" stop-color="#351824"/>
      <stop offset="1" stop-color="#4e1e2d"/>
    </linearGradient>
    <linearGradient id="side" x2="0" y2="1">
      <stop stop-color="#552231"/>
      <stop offset="1" stop-color="#200f19"/>
    </linearGradient>
    <linearGradient id="deck-top" x2="0" y2="1">
      <stop stop-color="#8e3c4a"/>
      <stop offset="1" stop-color="#47202f"/>
    </linearGradient>
    <linearGradient id="deck-edge" x2="0" y2="1">
      <stop stop-color="#c84d60"/>
      <stop offset="1" stop-color="#632437"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="1" x2="1" y2="0">
