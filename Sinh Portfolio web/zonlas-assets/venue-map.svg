    <use href="#seat" transform="translate(3 -20)"/>
    <use href="#seat" transform="translate(29 -11)"/>
    <use href="#seat" transform="translate(39 3)"/>
    <use href="#seat" transform="translate(-20 16)"/>
    <use href="#seat" transform="translate(21 16)"/>
