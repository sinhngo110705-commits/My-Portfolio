    <use href="#room" transform="scale(.96)"/>
    <path d="M-51-2 0-27 52-2 0 25Z" fill="#713047" stroke="#ee9b88" stroke-width=".8"/>
    <use href="#display-rack" transform="translate(-38 -4)"/>
    <use href="#display-rack" transform="translate(-23 -12)"/>
    <use href="#display-rack" transform="translate(19 -14)"/>
