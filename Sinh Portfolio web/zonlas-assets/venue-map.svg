    <circle cx="400" cy="47" r="2.25"/><circle cx="685" cy="132" r="2.25"/>
    <circle cx="760" cy="231" r="2.25"/><circle cx="626" cy="347" r="2.25"/>
    <circle cx="400" cy="425" r="2.25"/><circle cx="174" cy="347" r="2.25"/>
